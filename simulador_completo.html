<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema de Créditos</title>
</head>
<body>

<header>
  <h1>Sistema Básico de Créditos</h1>
   <link rel="stylesheet" href="simulador_completo.css">
</header>

<nav>
  <button onclick="mostrarSeccion('parametros')">Parámetros</button>
  <button onclick="mostrarSeccion('clientes')">Clientes</button>
</nav>

<section id="parametros" class="activa">
  <h2>Configurar Parámetros</h2>

  <label for="tasaInteres">Tasa de interés:</label>
  <input type="number" id="tasaInteres" min="10" max="20" value="15" step="any">
  <span>%</span>

  <br>
  <button onclick="guardarTasa()">Guardar tasa</button>

  <p id="mensajeTasa" role="status"></p>
</section>

<section id="clientes">
  <h2>Registro de Clientes</h2>

  <div class="campos">
    <label>Cédula<input type="text" id="cedula" placeholder="Ej. 0101234567" inputmode="numeric"></label>
    <label>Nombre<input type="text" id="nombre" placeholder="Nombre del cliente"></label>
    <label>Apellido<input type="text" id="apellido" placeholder="Apellido del cliente"></label>
    <label>Ingresos<input type="number" id="ingresos" placeholder="Ingresos mensuales" min="0" step="any"></label>
    <label>Egresos<input type="number" id="egresos" placeholder="Egresos mensuales" min="0" step="any"></label>
  </div>
  <button id="btnGuardarCliente" onclick="guardarCliente()">Guardar cliente</button>
  <button onclick="limpiar()">Limpiar</button>
  <p id="mensajeCliente" role="status"></p>
  <div class="tabla-contenedor">
  <table>
    <thead>
      <tr>
        <th>Cédula</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Ingresos</th>
        <th>Egresos</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="tablaClientes">
    </tbody>
  </table>
  </div>
</section>



<script src="utilitarios.js"></script>
<script src="simulador_completo.js"></script>
</body>
</html>
